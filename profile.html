<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile | KawaHub</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

<h1>Edit Profile</h1>

<form id="profileForm">

<input
type="text"
id="businessName"
placeholder="Business Name">

<input
type="text"
id="country"
placeholder="Country">

<textarea
id="bio"
placeholder="Tell people about yourself..."
rows="6"></textarea>

<button
class="btn"
type="submit">

Save Profile

</button>

</form>

</div>

<script type="module" src="profile.js"></script>

</body>
</html>
