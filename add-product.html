<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | KawaHub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="form-container">

<h1>Add Product</h1>

<form id="productForm">

<input
type="text"
id="productName"
placeholder="Product Name"
required>

<input
type="number"
id="price"
placeholder="Price"
required>

<input
type="text"
id="category"
placeholder="Category"
required>

<textarea
id="description"
placeholder="Product Description"
rows="6"
required></textarea>

<button
class="btn"
type="submit">

Post Product

</button>

</form>

</div>

<script type="module" src="add-product.js"></script>

</body>
  </html>
